name: Gridware
description: 'Gridware builds grid intelligence technology for electric utilities. Its Active Grid
  Response (AGR) platform pairs pole-mounted GridScope sensors with analytics to bring real-time
  visibility into the physical, electrical, and environmental condition of every span of the
  distribution grid, closing the "Hazard Awareness Delay" between when a fault or hazard occurs and
  when a utility detects it. Gridware supports fault prevention, faster power restoration, wildfire
  and hazard response, and grid asset management. Headquartered in San Francisco with an Applied
  Research Complex in Richmond, California, the company is backed by True Ventures. Gridware does not
  currently publish a public developer API, SDKs, or API documentation; this profile captures its
  public identity, trust/compliance posture, and domain security.'
